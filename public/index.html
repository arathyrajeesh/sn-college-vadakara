  <!-- Google Fonts: Editorial Serif + Malayalam Typography + Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link

<body>

  <!-- SVG Paper Grain Filter Definition -->
  <svg class="svg-grain-defs" aria-hidden="true">
    <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.12   0 0 0 0 0.09   0 0 0 0 0.05   0 0 0 0 0.045 0" />
    </filter>
  </svg>

  <!-- Main Viewport Shell (iPhone 17 Form Factor Centered) -->
  <div class="app-shell-container" id="appShell">

    <!-- ============================================== -->
    <!-- 1. CINEMATIC FULLSCREEN VIDEO SPLASH SCREEN    -->
    <!-- ============================================== -->
    <section class="splash-screen" id="splashScreen" aria-label="Application Splash Screen">
      <!-- Fullscreen Video Focal Centerpiece -->
      <div class="splash-video-container">
        <video id="splashVideo" class="splash-video-fullscreen" autoplay muted playsinline webkit-playsinline
          preload="auto">
          <source src="assets/videos/VIRAL_PAAD_1.mp4" type="video/mp4">
          Your browser does not support video playback.
        </video>
      </div>

      <!-- Subtle Paper Grain & Ambient Vignette Overlays -->
      <div class="splash-paper-grain" aria-hidden="true"></div>
      <div class="splash-ambient-vignette" aria-hidden="true"></div>

      <!-- Invisible intuitive click/tap capture layer for instant smooth transition -->
      <div class="splash-tap-trigger" id="splashTapTrigger" title="Tap to enter application"
        aria-label="Tap to enter application"></div>
    </section>

    <!-- 2. HOME PAGE (MATCHING REFERENCE DESIGN)       -->

        <button type="button" class="btn-profile-avatar" id="adminBtn" aria-label="Admin Profile" title="Admin Profile"
          onclick="window.location.href='/admin'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>

        </button>

        <div class="home-logo-header">

        </div>

        <!-- Audio Chapters / Feature Cards List -->

            </div>
            <button type="button" class="track-play-btn" aria-label="Play Track 1">

                <polygon points="7 4 19 12 7 20 7 4"></polygon>
              </svg>
              <svg class="pause-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
