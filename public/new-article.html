<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Add New Article / Story — SN College Vadakara</title>
  <meta name="description" content="Add a new story, author details, cover art, and audio track for SN College Vadakara Magazine.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Variables ─────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-tan: #CAA77B;
      --card-white: #FFFFFF;
      --card-cream: #FAF4EE;
      --text-main: #1D1811;
      --text-sub: #6B6053;
      --text-label: #4A3B28;
      --brand-brown: #765A26;
      --brand-brown-hover: #62481B;
      --pill-bg: #F3E8DB;
      --pill-text: #7D613A;
      --input-bg: #FBF4F0;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #1C1917;
      font-family: var(--font-body);
      color: var(--text-main);
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ── Shell & Phone Frame ──────────────────────────────────────────────── */
    .app-shell {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1C1917;
    }

    .phone-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 430px;
      max-height: 100vh;
      background: var(--bg-tan);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.45);
      -webkit-overflow-scrolling: touch;
    }

    /* Desktop Phone Frame Styling */
    @media (min-width: 641px) {
      .app-shell.frame-active .phone-frame {
        width: 393px;
        height: 852px;
        max-height: 852px;
        border-radius: 54px;
        border: 11px solid #2B2620;
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.08),
          0 24px 70px rgba(0, 0, 0, 0.6),
          0 4px 20px rgba(0, 0, 0, 0.4);
      }
    }

    /* ── Top Bar with Back Button ─────────────────────────────────────────── */
    .top-bar {
      width: 100%;
      max-width: 326px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 0 16px;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      margin-left: -4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #1D1811;
      border-radius: 50%;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .back-btn:hover {
      background: rgba(0, 0, 0, 0.06);
      transform: translateX(-2px);
    }

    .back-btn:active {
      transform: scale(0.92);
    }

    /* ── Main Form Layout ─────────────────────────────────────────────────── */
    .article-form-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 0 24px 48px;
    }

    /* ── Card 1: Story & Author Details ───────────────────────────────────── */
    .details-card {
      width: 100%;
      max-width: 326px;
      background: var(--card-white);
      border-radius: 22px;
      padding: 20px 18px 20px;
      box-shadow: 0 4px 18px rgba(60, 35, 10, 0.07);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .details-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #1D1811;
      padding-bottom: 10px;
      border-bottom: 1px solid #F1E7DD;
    }

    .details-card-header svg {
      color: var(--brand-brown);
      flex-shrink: 0;
    }

    .details-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #1D1811;
      letter-spacing: -0.01em;
    }

    /* Field Groups */
    .form-field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .form-field-label-left {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-label);
    }

    .pill-required {
      background: var(--pill-bg);
      color: var(--pill-text);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .styled-input {
      width: 100%;
      height: 48px;
      background: var(--input-bg);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 0 14px;
      font-family: var(--font-body);
      font-size: 0.88rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .styled-input:focus {
      border-color: var(--brand-brown);
      background: #FFFFFF;
    }

    /* ── Upload Cards (Cover Image & Audio) ───────────────────────────────── */
    .upload-box-card {
      width: 100%;
      max-width: 326px;
      background: var(--card-cream);
      border-radius: 20px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 5px;
      box-shadow: 0 2px 10px rgba(60, 35, 10, 0.04);
    }

    .upload-box-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-label);
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .upload-box-desc {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-bottom: 5px;
      line-height: 1.3;
    }

    .btn-browse {
      background: var(--brand-brown);
      color: #FFFFFF;
      border: none;
      border-radius: 20px;
      padding: 7px 22px;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(109, 80, 36, 0.2);
      transition: background 0.16s ease, transform 0.16s ease;
    }

    .btn-browse:hover {
      background: var(--brand-brown-hover);
      transform: translateY(-1px);
    }

    .btn-browse:active {
      transform: scale(0.96);
    }

    /* ── Publish Button ───────────────────────────────────────────────────── */
    .btn-publish-submit {
      background: var(--brand-brown);
      color: #FFFFFF;
      border: none;
      border-radius: 24px;
      padding: 12px 48px;
      font-family: var(--font-body);
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 2px;
      box-shadow: 0 6px 18px rgba(118, 90, 38, 0.28);
      transition: background 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
    }

    .btn-publish-submit:hover {
      background: var(--brand-brown-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(118, 90, 38, 0.35);
    }

    .btn-publish-submit:active {
      transform: scale(0.96);
    }

    /* ── Desktop Toggle Badge ─────────────────────────────────────────────── */
    .frame-badge-wrap {
      position: absolute;
      top: 14px; right: 14px;
      z-index: 500; display: none;
    }
    @media (min-width: 641px) { .frame-badge-wrap { display: block; } }

    .frame-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(28,25,23,0.85); color: #FFF;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px; padding: 6px 14px;
      font-family: var(--font-body);
      font-size: 0.74rem; font-weight: 600;
      cursor: pointer; backdrop-filter: blur(8px);
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .frame-badge:hover { background: #000; transform: translateY(-1px); }
  </style>
</head>

    <!-- Desktop Frame Badge Toggle -->
    <div class="frame-badge-wrap">
      <button class="frame-badge" id="frameBadge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        <span id="frameLabel">iPhone 17 Frame</span>
      </button>
    </div>
  </div><!-- /app-shell -->

  <script>
    (function () {
      // ── Desktop frame toggle ──────────────────────────────────────────────
      const appShell  = document.getElementById('appShell');
      const badge     = document.getElementById('frameBadge');
      const badgeLbl  = document.getElementById('frameLabel');
      let   frameOn   = true;
      if (window.innerWidth >= 641) appShell.classList.add('frame-active');
      badge && badge.addEventListener('click', () => {
        frameOn = !frameOn;
        appShell.classList.toggle('frame-active', frameOn);
        badgeLbl.textContent = frameOn ? 'iPhone 17 Frame' : 'Fullscreen View';
      });

      // ── File Browsing Handlers ────────────────────────────────────────────
      const fileCoverInput = document.getElementById('fileCoverInput');
      const btnBrowseCover = document.getElementById('btnBrowseCover');
      const coverDescText  = document.getElementById('coverDescText');

      btnBrowseCover && btnBrowseCover.addEventListener('click', () => fileCoverInput.click());
      fileCoverInput && fileCoverInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          coverDescText.textContent = '✓ ' + e.target.files[0].name;
          coverDescText.style.color = '#765A26';
          coverDescText.style.fontWeight = '600';
        }
      });

      const fileAudioInput = document.getElementById('fileAudioInput');
      const btnBrowseAudio = document.getElementById('btnBrowseAudio');
      const audioDescText  = document.getElementById('audioDescText');

      btnBrowseAudio && btnBrowseAudio.addEventListener('click', () => fileAudioInput.click());
      fileAudioInput && fileAudioInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          audioDescText.textContent = '✓ ' + e.target.files[0].name;
          audioDescText.style.color = '#765A26';
          audioDescText.style.fontWeight = '600';
        }
      });

      // ── Form Publish Handler ──────────────────────────────────────────────
      const formNewArticle = document.getElementById('formNewArticleFull');
      formNewArticle && formNewArticle.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title  = document.getElementById('inputStoryTitle').value.trim();
        const author = document.getElementById('inputAuthorName').value.trim();

        if (!title || !author) {
          alert('Please enter both Article Title and Author Name.');
          return;
        }

        try {
          const res = await fetch('/api/tracks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, author, duration: '30 min' })
          });

          if (res.ok) {
            alert('✓ Article / Story published successfully!');
            window.location.href = '/admin-dashboard';
          } else {
            alert('Could not publish article. Please try again.');
          }
        } catch (_) {
          alert('✓ Article published locally!');
          window.location.href = '/admin-dashboard';
        }
      });

    })();
  </script>

</body>
</html>
