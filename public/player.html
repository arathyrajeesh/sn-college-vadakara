<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no,
           viewport-fit=cover">

  <title>Now Playing | വിരൽപ്പാട്</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    /* =========================================================
   RESET
========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }


    /* =========================================================
   PHONE FRAME
========================================================= */

    .app-shell {
      width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;
    }

    .phone-frame {
      position: relative;

      width: 100%;
      height: 100%;

      background: #ffffff;

      overflow: hidden;
    }


    /* Desktop preview */

    @media (min-width: 641px) {

      .phone-frame {
        width: 393px;
        height: 852px;

        border-radius: 20px;

        box-shadow:
          0 0 0 8px #181614,
          0 20px 60px rgba(0, 0, 0, 0.25);
      }

    }


    /* =========================================================
   PLAYER PAGE
========================================================= */

    .player-page {

      position: relative;

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;

      /*
   * THIS IS THE MAIN FIX
   *
   * Centers all player content horizontally
   * and vertically.
   */
      align-items: center;
      justify-content: center;

      background: #ffffff;

      padding:
        calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);

    }


    /* =========================================================
   BACK BUTTON
========================================================= */

    .back-row {

      position: absolute;

      top: calc(env(safe-area-inset-top) + 14px);
      left: 14px;

      z-index: 10;
    }

    .back-btn {

      width: 38px;
      height: 38px;

      border: none;
      background: transparent;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      color: #1a1a1a;

      border-radius: 50%;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .back-btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .back-btn:active {
      transform: scale(0.92);
    }


    /* =========================================================
   ARTWORK
========================================================= */

    .artwork-wrap {

      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 20px 18px;

      flex-shrink: 0;
    }

    .artwork-card {

      width: 282px;
      max-width: 100%;

      aspect-ratio: 1 / 1;

      border-radius: 18px;

      overflow: hidden;

      background: #F9F0EB;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08),
        0 2px 8px rgba(0, 0, 0, 0.04);

      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    body.playing .artwork-card {
      transform: scale(1.02);
      box-shadow:
        0 12px 36px rgba(0, 0, 0, 0.12),
        0 4px 12px rgba(0, 0, 0, 0.06);
    }

    .artwork-card img {

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center;

      display: block;
      transition: opacity 0.25s ease;
    }


    /* =========================================================
   TRACK INFORMATION
========================================================= */

    .track-info {

      width: 100%;

      text-align: center;

      padding: 0 20px 18px;

      flex-shrink: 0;
    }

    .track-title-text {

      font-family:
        'Playfair Display',
        Georgia,
        serif;

      font-size: 18px;

      font-weight: 700;

      color: #111111;

      line-height: 1.35;

      margin-bottom: 4px;
    }

    .track-artist-text {

      font-family:
        'Plus Jakarta Sans',
        sans-serif;

      font-size: 11px;

      color: #aaaaaa;
    }


    /* =========================================================
   PROGRESS
========================================================= */

    .progress-section {

      width: 100%;

      max-width: 340px;

      padding: 0 4px 18px;

      flex-shrink: 0;
    }

    .progress-row {

      width: 100%;

      display: flex;

      align-items: center;

      gap: 10px;
    }

    .time-label {

      min-width: 48px;

      font-family:
        'Plus Jakarta Sans',
        sans-serif;

      font-size: 8px;

      color: #999999;
    }

    .time-total {
      text-align: right;
    }


    /* Progress bar */

    .progress-bar-wrap {

      flex: 1;

      height: 24px;

      position: relative;

      display: flex;

      align-items: center;

      cursor: pointer;
    }

    .progress-bar-track {

      position: absolute;

      left: 0;
      right: 0;

      height: 2px;

      background: #e8e8e8;

      border-radius: 2px;
    }

    .progress-bar-fill {

      position: relative;

      width: 0%;

      height: 100%;

      background: #bbbbbb;

      border-radius: 2px;

      transition: width 0.3s linear;
    }

    .progress-bar-fill::after {

      content: "";

      position: absolute;

      right: -6px;

      top: 50%;

      transform: translateY(-50%);

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: #c9a050;

    }


    /* =========================================================
   CONTROLS
========================================================= */

    .controls-row {

      width: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      flex-shrink: 0;
    }


    /* Small controls */

    .ctrl-icon,
    .ctrl-skip {

      border: none;

      background: transparent;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;
      transition: color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }

    .ctrl-icon {

      width: 40px;
      height: 40px;

      color: #999999;
    }

    .ctrl-icon:hover {
      color: #666666;
      background: rgba(0, 0, 0, 0.04);
    }

    .ctrl-icon.active {
      color: #c9a050;
    }

    .ctrl-skip {

      width: 44px;
      height: 44px;

      color: #333333;
    }

    .ctrl-skip:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .ctrl-skip:active {
      transform: scale(0.9);
    }


    /* Main play button */

    .ctrl-play {

      width: 62px;
      height: 62px;

      border-radius: 50%;

      border: none;

      background: #c9a050;

      color: #ffffff;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      box-shadow:
        0 6px 22px rgba(180, 140, 50, 0.40),
        0 2px 8px rgba(180, 140, 50, 0.22);

      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .ctrl-play:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 26px rgba(180, 140, 50, 0.46);
    }

    .ctrl-play:active {
      transform: scale(0.94);
    }


    /* Pause initially hidden */

    .icon-pause {
      display: none;
    }

    body.playing .icon-play {
      display: none;
    }

    body.playing .icon-pause {
      display: block;
    }


    /* =========================================================
   MOBILE
========================================================= */

    @media (max-width: 390px) {

      .artwork-card {
        width: 250px;
      }

      .controls-row {
        gap: 6px;
      }

    }
  </style>

</head>


<body>

  <div class="app-shell">

    <div class="phone-frame">

      <main class="player-page">


        <!-- BACK BUTTON -->

        <div class="back-row">

          <button class="back-btn" id="backBtn" aria-label="Go back">

            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">

              <polyline points="15 18 9 12 15 6" />

            </svg>

          </button>

        </div>


        <!-- =================================================
           CENTERED PLAYER CONTENT
      ================================================== -->

        <div class="artwork-wrap">

          <div class="artwork-card" id="artworkCard">

            <img id="artworkImg" src="assets/images/artwork_default.jpg" alt="Artwork">

          </div>

        </div>


        <!-- TRACK INFORMATION -->

        <div class="track-info">

          <div class="track-title-text" id="trackTitle">
            Loading...
          </div>

          <div class="track-artist-text" id="trackArtist">
            Charles Dickens
          </div>

        </div>


        <!-- PROGRESS -->

        <div class="progress-section">

          <div class="progress-row">

            <span class="time-label" id="timeCurrent">
              0:00
            </span>


            <div class="progress-bar-wrap" id="progressBarWrap">

              <div class="progress-bar-track">

                <div class="progress-bar-fill" id="progressFill"></div>

              </div>

            </div>


            <span class="time-label time-total" id="timeTotal">
              0:00
            </span>

          </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls-row">


          <!-- SHUFFLE -->

          <button class="ctrl-icon" id="btnShuffle" aria-label="Shuffle" title="Shuffle">

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">

              <polyline points="16 3 21 3 21 8" />
              <line x1="4" y1="20" x2="21" y2="3" />
              <polyline points="21 16 21 21 16 21" />
              <line x1="15" y1="15" x2="21" y2="21" />

            </svg>

          </button>


          <!-- PREVIOUS -->

          <button class="ctrl-skip" id="btnPrev" aria-label="Previous">

            <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor">

              <polygon points="19 20 9 12 19 4 19 20" />
              <rect x="4" y="4" width="3" height="16" />

            </svg>

          </button>


          <!-- PLAY -->

          <button class="ctrl-play" id="btnPlay" aria-label="Play or pause">

            <svg class="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">

              <polygon points="7 4 19 12 7 20 7 4" />

            </svg>


            <svg class="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">

              <rect x="5" y="4" width="4" height="16" />

              <rect x="15" y="4" width="4" height="16" />

            </svg>

          </button>


          <!-- NEXT -->

          <button class="ctrl-skip" id="btnNext" aria-label="Next">

            <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor">

              <polygon points="5 4 15 12 5 20 5 4" />
              <rect x="17" y="4" width="3" height="16" />

            </svg>

          </button>


          <!-- REPEAT -->

          <button class="ctrl-icon" id="btnRepeat" aria-label="Repeat" title="Repeat">

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">

              <polyline points="17 1 21 5 17 9" />
              <path d="M3 11V9a4 4 0 0 1 4-4h14" />
              <polyline points="7 23 3 19 7 15" />
              <path d="M21 13v2a4 4 0 0 1-4 4H3" />

            </svg>

          </button>

        </div>

      </main>

    </div>

  </div>


  <script>

    /* =========================================================
       TRACK DATABASE & PLAYLIST
    ========================================================= */

    const ALL_TRACKS = [
      { id: 1, title: "X. The Substance of the Shadow", author: "Editorial", duration: "35:00", totalSec: 2100, artwork: "assets/images/artwork_default.jpg" },
      { id: 2, title: "II. Ink on Borrowed Time", author: "Poetry", duration: "28:00", totalSec: 1680, artwork: "assets/images/artwork_default.jpg" },
      { id: 3, title: "III. Roots & Reverie", author: "Fiction", duration: "42:00", totalSec: 2520, artwork: "assets/images/artwork_default.jpg" },
      { id: 4, title: "IV. Letters Never Sent", author: "Essay", duration: "19:00", totalSec: 1140, artwork: "assets/images/artwork_default.jpg" },
      { id: 5, title: "V. The Weight of Wings", author: "Short Story", duration: "31:00", totalSec: 1860, artwork: "assets/images/artwork_default.jpg" },
      { id: 6, title: "VI. Monsoon Cartography", author: "Verse", duration: "24:00", totalSec: 1440, artwork: "assets/images/artwork_default.jpg" }
    ];

    let currentIndex = 0;
    let isShuffle = false;
    let isRepeat = false;

    // Read selected track from sessionStorage if passed from song-list / home page
    try {
      const saved = JSON.parse(sessionStorage.getItem("vp_track"));
      if (saved && saved.id) {
        const foundIdx = ALL_TRACKS.findIndex(t => t.id === saved.id);
        if (foundIdx !== -1) currentIndex = foundIdx;
      }
    } catch (_) { }

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const title = document.getElementById("trackTitle");
    const artist = document.getElementById("trackArtist");
    const total = document.getElementById("timeTotal");
    const artwork = document.getElementById("artworkImg");
    const progress = document.getElementById("progressFill");
    const current = document.getElementById("timeCurrent");
    const playBtn = document.getElementById("btnPlay");
    const prevBtn = document.getElementById("btnPrev");
    const nextBtn = document.getElementById("btnNext");
    const shuffleBtn = document.getElementById("btnShuffle");
    const repeatBtn = document.getElementById("btnRepeat");
    const backBtn = document.getElementById("backBtn");

    /* =========================================================
       DATABASE COVER IMAGE & TRACK LOADER
    ========================================================= */

    function loadTrack(index) {
      currentIndex = (index + ALL_TRACKS.length) % ALL_TRACKS.length;
      const track = ALL_TRACKS[currentIndex];

      title.textContent = track.title;
      artist.textContent = track.author;
      total.textContent = track.duration;

      // Default fallback image
      artwork.src = track.artwork || "assets/images/artwork_default.jpg";

      // Fetch from database API route (/api/tracks/:id)
      fetch(`/api/tracks/${track.id}`)
        .then(res => res.ok ? res.json() : null)
        .then(data => {
          const coverUrl = data && data.data && (data.data.cover_url || data.data.image_url);
          if (coverUrl) {
            artwork.src = coverUrl;
          }
        })
        .catch(() => {
          // keep fallback
        });

      elapsed = 0;
      updateProgress();
    }

    /* =========================================================
       PLAY / PAUSE & AUDIO SYNTHESIS
    ========================================================= */

    let isPlaying = false;
    let elapsed = 0;
    let timer = null;
    let audioCtx = null;
    let oscNode = null;
    let gainNode = null;

    const FREQS = [220, 246.94, 261.63, 293.66, 329.63, 349.23];

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function startAudio() {
      stopAudio();
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const freq = FREQS[currentIndex % FREQS.length];
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(freq * 1.002, ctx.currentTime + 3);

        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();

        oscNode = osc;
        gainNode = gain;
      } catch (_) { }
    }

    function stopAudio() {
      if (oscNode && gainNode && audioCtx) {
        try {
          gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
          const o = oscNode;
          setTimeout(() => { try { o.stop(); } catch (_) { } }, 200);
        } catch (_) { }
      }
      oscNode = null;
      gainNode = null;
    }

    function formatTime(seconds) {
      const s = Math.floor(Math.max(0, seconds));
      const mins = Math.floor(s / 60);
      const secs = Math.floor(s % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function updateProgress() {
      const currentTrack = ALL_TRACKS[currentIndex];
      const percentage = (elapsed / currentTrack.totalSec) * 100;
      progress.style.width = Math.min(percentage, 100).toFixed(2) + "%";
      current.textContent = formatTime(elapsed);
    }

    function startPlaying() {
      isPlaying = true;
      document.body.classList.add("playing");
      startAudio();

      clearInterval(timer);
      timer = setInterval(() => {
        elapsed += 1;
        updateProgress();

        const currentTrack = ALL_TRACKS[currentIndex];
        if (elapsed >= currentTrack.totalSec) {
          if (isRepeat) {
            elapsed = 0;
            updateProgress();
          } else {
            skipNext();
          }
        }
      }, 1000);
    }

    function pausePlaying() {
      isPlaying = false;
      document.body.classList.remove("playing");
      stopAudio();
      clearInterval(timer);
    }

    playBtn.addEventListener("click", () => {
      if (isPlaying) {
        pausePlaying();
      } else {
        startPlaying();
      }
    });

    /* =========================================================
       NEXT / PREVIOUS / SHUFFLE / REPEAT
    ========================================================= */

    function skipNext() {
      if (isShuffle) {
        let next;
        do {
          next = Math.floor(Math.random() * ALL_TRACKS.length);
        } while (next === currentIndex && ALL_TRACKS.length > 1);
        loadTrack(next);
      } else {
        loadTrack(currentIndex + 1);
      }
      if (isPlaying) startPlaying();
    }

    function skipPrev() {
      if (elapsed > 3) {
        elapsed = 0;
        updateProgress();
        return;
      }
      loadTrack(currentIndex - 1);
      if (isPlaying) startPlaying();
    }

    nextBtn.addEventListener("click", skipNext);
    prevBtn.addEventListener("click", skipPrev);

    shuffleBtn.addEventListener("click", () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle("active", isShuffle);
    });

    repeatBtn.addEventListener("click", () => {
      isRepeat = !isRepeat;
      repeatBtn.classList.toggle("active", isRepeat);
    });

    /* =========================================================
       PROGRESS SEEK
    ========================================================= */

    document.getElementById("progressBarWrap").addEventListener("click", (event) => {
      const rect = event.currentTarget.getBoundingClientRect();
      const percentage = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      const currentTrack = ALL_TRACKS[currentIndex];
      elapsed = percentage * currentTrack.totalSec;
      updateProgress();
    });

    /* =========================================================
       BACK NAVIGATION
    ========================================================= */

    backBtn.addEventListener("click", () => {
      pausePlaying();
      sessionStorage.setItem("vp_track", JSON.stringify({
        id: ALL_TRACKS[currentIndex].id,
        elapsed: elapsed
      }));
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/home";
      }
    });

    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    loadTrack(currentIndex);
    updateProgress();

  </script>

</body>

</html>
