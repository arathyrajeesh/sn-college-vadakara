<!DOCTYPE html>
<html lang="ml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFFCF9">
  <title>വിരൽപ്പാട് | Manage Playlist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-home: #FFFFFF;
      --bg-desktop-shell: #EDE8DE;
      --color-crimson: #8C1414;
      --surface-card-first: #EDE6DB;
      --surface-card-grey: #DCDCDD;
      --surface-card-grey-hover: #D2D2D4;
      --gold-play-btn: #B4965A;
      --gold-play-btn-hover: #A38448;
      --profile-avatar-bg: #685128;
      --ink-primary: #1A1A1A;
      --ink-muted: #7A7A7A;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-malayalam: 'Anek Malayalam', sans-serif;
      --phone-width: 393px;
      --phone-height: 852px;
      --phone-radius: 44px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-home);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* App Shell Container */
    .app-shell-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-desktop-shell);
      background-image: radial-gradient(circle at 50% 50%, #FAF7F2 0%, #E3DCCE 100%);
      overflow: hidden;
    }

    @media (min-width: 641px) {
      .app-shell-container.desktop-frame-active .manage-screen {
        width: var(--phone-width);
        height: var(--phone-height);
        max-height: 94vh;
        border-radius: var(--phone-radius);
        box-shadow:
          0 0 0 10px #181614,
          0 0 0 12px #3E3834,
          0 30px 70px -15px rgba(0, 0, 0, 0.4),
          0 15px 30px -10px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        position: relative;
      }
    }

    /* Manage Screen */
    .manage-screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-home);
      overflow: hidden;
      z-index: 10;
    }

    /* Top Action Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: calc(24px + env(safe-area-inset-top)) 20px 0 20px;
      z-index: 20;
    }

    .btn-back {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #F0ECE6;
      color: #3A2E1C;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      transition: transform 0.16s ease, background-color 0.16s ease;
    }

    .btn-back:hover {
      background-color: #E2DBD2;
      transform: scale(1.05);
    }

    .admin-pill-badge {
      font-size: 0.72rem;
      font-weight: 700;
      background: #F3E8DB;
      color: #7D613A;
      padding: 4px 12px;
      border-radius: 12px;
      letter-spacing: 0.02em;
    }

    /* Scrollable Content */
    .content-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 18px calc(24px + env(safe-area-inset-bottom)) 18px;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo Header */
    .logo-header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 12px;
      padding: 8px 0 24px 0;
    }

    .title-logo {
      width: 78%;
      max-width: 250px;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Drag Instruction Hint */
    .drag-hint-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .hint-text {
      font-size: 0.75rem;
      font-weight: 600;
      color: #8C7B65;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-add-shortcut {
      font-size: 0.75rem;
      font-weight: 700;
      color: #765A26;
      background: #F3E8DB;
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 10px;
      transition: background 0.15s ease;
    }

    .btn-add-shortcut:hover {
      background: #E8DAC8;
    }

    /* Tracks List */
    .tracks-list-section {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    /* Track Card — Pixel Perfect */
    .track-card {
      width: 100%;
      background-color: var(--surface-card-grey);
      border-radius: 2px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1.5px solid transparent;
      outline: none;
      transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
      cursor: grab;
      user-select: none;
      position: relative;
    }

    .track-card:active {
      cursor: grabbing;
    }

    .track-card.first-card {
      background-color: var(--surface-card-first);
    }

    .track-card.dragging {
      opacity: 0.45;
      transform: scale(0.98);
      border: 1.5px dashed var(--gold-play-btn);
    }

    .track-card.drag-over {
      border: 1.5px solid var(--gold-play-btn);
      box-shadow: 0 4px 12px rgba(180, 150, 90, 0.25);
    }

    /* Drag Handle + Info Left */
    .track-card-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .drag-handle {
      color: #9C9A96;
      cursor: grab;
      font-size: 1.1rem;
      line-height: 1;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      touch-action: none;
    }

    .drag-handle:hover {
      color: #4A463F;
    }

    .track-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .track-title {
      font-family: var(--font-serif);
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--ink-primary);
      line-height: 1.25;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-duration {
      font-family: var(--font-sans);
      font-size: 0.74rem;
      font-weight: 400;
      color: var(--ink-muted);
      margin-top: 3px;
    }

    /* Right Action Controls: Edit + Delete */
    .track-card-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* Action Buttons (Edit & Delete) */
    .btn-card-action {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.88rem;
      transition: transform 0.16s ease, background-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
      background: #FFFFFF;
      color: #4A4032;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }

    .btn-card-action:hover {
      transform: scale(1.08);
      background: #FFFFFF;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .btn-card-action.btn-edit:hover {
      color: #765A26;
      border-color: #765A26;
    }

    .btn-card-action.btn-delete:hover {
      background: #FFF1F0;
      border-color: #FF4D4F;
      color: #CF1322;
    }

    /* ── Edit Modal ────────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 340px;
      background: #FFFFFF;
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open .modal-box {
      transform: scale(1);
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1D1811;
    }

    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .modal-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #5A401B;
    }

    .modal-input {
      width: 100%;
      height: 42px;
      background: #FBF4F0;
      border: 1.5px solid transparent;
      border-radius: 10px;
      padding: 0 12px;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      color: #1D1811;
      outline: none;
    }

    .modal-input:focus {
      border-color: #765A26;
      background: #FFFFFF;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-modal-cancel {
      background: #F0ECE6;
      border: none;
      color: #555;
      padding: 8px 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-modal-save {
      background: var(--gold-play-btn);
      border: none;
      color: #FFFFFF;
      padding: 8px 18px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-modal-save:hover {
      background: var(--gold-play-btn-hover);
    }

    .empty-state {
      text-align: center;
      padding: 40px 12px;
      color: var(--ink-muted);
      font-size: 0.92rem;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="app-shell-container" id="appShell">
    <div class="manage-screen">

      <!-- Top Action Bar -->
      <header class="top-bar">
        <button type="button" class="btn-back" onclick="window.location.href='/admin-dashboard'"
          aria-label="Back to Admin Dashboard" title="Back to Admin Dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="admin-pill-badge">Playlist Manager</span>
      </header>

      <!-- Scrollable Main Container -->
      <main class="content-container">

        <!-- Centerpiece Crimson Title Logo -->
        <div class="logo-header">
          <img src="assets/images/home.png" alt="വിരൽപ്പാട്" class="title-logo" loading="eager" />
        </div>

        <!-- Reorder Hint Header -->
        <div class="drag-hint-bar">
          <span class="hint-text">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="7 10 12 15 17 10"></polyline>
              <polyline points="7 14 12 9 17 14"></polyline>
            </svg>
            Drag cards to reorder
          </span>
          <a href="/new-article" class="btn-add-shortcut">+ Add Song</a>
        </div>

        <!-- Draggable Tracks Section -->
        <section class="tracks-list-section" id="tracksContainer" aria-label="Manage Songs List">
          <!-- Dynamically loaded tracks -->
        </section>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box" style="text-align: center; gap: 16px; max-width: 320px;">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: #FFF1F0; color: #CF1322; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 1.5rem; border: 1px solid #FFCCC7;">
        🗑️
      </div>
      <div>
        <h3 class="modal-title" style="margin-bottom: 6px; font-size: 1.05rem;">Delete Song?</h3>
        <p style="font-size: 0.82rem; color: #6B6053; line-height: 1.45;" id="deleteSongPromptText">
          Are you sure you want to delete this song? This will remove it from the database.
        </p>
      </div>
      <div class="modal-actions" style="justify-content: center; gap: 10px; width: 100%; margin-top: 4px;">
        <button type="button" class="btn-modal-cancel" id="btnCancelDelete" style="flex: 1; height: 42px; border-radius: 12px; font-size: 0.85rem;">Cancel</button>
        <button type="button" id="btnConfirmDelete" style="flex: 1; height: 42px; background: #CF1322; color: #FFF; border: none; border-radius: 12px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: background 0.15s ease;">Delete</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ── Auth Guard ─────────────────────────────────────────────────────────
      if (!sessionStorage.getItem('vp_admin')) {
        window.location.href = '/admin';
        return;
      }

      // ── Desktop Frame Toggle ──────────────────────────────────────────────
      const appShell = document.getElementById('appShell');
      if (window.innerWidth >= 641 && appShell) {
        appShell.classList.add('desktop-frame-active');
      }

      const tracksContainer = document.getElementById('tracksContainer');
      const deleteModal = document.getElementById('deleteModal');
      const deleteSongPromptText = document.getElementById('deleteSongPromptText');
      const btnCancelDelete = document.getElementById('btnCancelDelete');
      const btnConfirmDelete = document.getElementById('btnConfirmDelete');

      let songs = [];
      let draggedIndex = null;
      let songToDelete = null;

      // ── Load Songs from Supabase API ───────────────────────────────────────
      async function loadSongs() {
        tracksContainer.innerHTML = '<div class="empty-state">Loading songs from database...</div>';
        try {
          const res = await fetch('/api/songs?admin=true');
          if (res.ok) {
            const json = await res.json();
            songs = json.data || [];
            // Sort by display_order
            songs.sort((a, b) => (a.display_order || 0) - (b.display_order || 0));
            renderCards();
            return;
          }
        } catch (e) {
          console.warn('Load note:', e);
        }
        songs = [];
        renderCards();
      }

      // ── Render Track Cards matching Screenshot ─────────────────────────────
      function renderCards() {
        tracksContainer.innerHTML = '';

        if (songs.length === 0) {
          tracksContainer.innerHTML = `
            <div class="empty-state">
              No songs available yet.<br><br>
              <a href="/new-article" class="btn-add-shortcut" style="display:inline-block;">+ Add First Song</a>
            </div>
          `;
          return;
        }

        songs.forEach((song, idx) => {
          const card = document.createElement('article');
          card.className = 'track-card' + (idx === 0 ? ' first-card' : '');
          card.draggable = true;
          card.dataset.index = idx;
          card.dataset.id = song.id;

          card.innerHTML = `
            <div class="track-card-left">
              <span class="drag-handle" title="Drag to reorder">⠿</span>
              <div class="track-info">
                <h2 class="track-title">${escapeHtml(song.title)}</h2>
                <span class="track-duration">${escapeHtml(song.duration || '35 min')}</span>
              </div>
            </div>
            <div class="track-card-right">
              <button type="button" class="btn-card-action btn-edit" title="Edit song details" aria-label="Edit">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>
              <button type="button" class="btn-card-action btn-delete" title="Delete song" aria-label="Delete">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          `;

          // ── Drag and Drop Handlers ─────────────────────────────────────────
          card.addEventListener('dragstart', (e) => {
            draggedIndex = idx;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', idx);
          });

          card.addEventListener('dragend', () => {
            card.classList.remove('dragging');
            document.querySelectorAll('.track-card').forEach(c => c.classList.remove('drag-over'));
          });

          card.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            card.classList.add('drag-over');
          });

          card.addEventListener('dragleave', () => {
            card.classList.remove('drag-over');
          });

          card.addEventListener('drop', (e) => {
            e.preventDefault();
            card.classList.remove('drag-over');
            const targetIndex = idx;

            if (draggedIndex !== null && draggedIndex !== targetIndex) {
              const movedSong = songs.splice(draggedIndex, 1)[0];
              songs.splice(targetIndex, 0, movedSong);

              // Update display_order property for all
              songs.forEach((s, i) => s.display_order = i + 1);

              renderCards();
              saveOrderToBackend();
            }
          });

          // ── Touch Drag Support for Mobile ──────────────────────────────────
          const handle = card.querySelector('.drag-handle');
          let touchStartY = 0;
          handle.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            draggedIndex = idx;
            card.classList.add('dragging');
          }, { passive: true });

          handle.addEventListener('touchend', (e) => {
            card.classList.remove('dragging');
            const touchEndY = e.changedTouches[0].clientY;
            const delta = touchEndY - touchStartY;
            const moveSteps = Math.round(delta / 60);

            if (moveSteps !== 0 && draggedIndex !== null) {
              const targetIdx = Math.max(0, Math.min(songs.length - 1, draggedIndex + moveSteps));
              if (targetIdx !== draggedIndex) {
                const moved = songs.splice(draggedIndex, 1)[0];
                songs.splice(targetIdx, 0, moved);
                songs.forEach((s, i) => s.display_order = i + 1);
                renderCards();
                saveOrderToBackend();
              }
            }
            draggedIndex = null;
          }, { passive: true });

          // ── Edit Button Handler (Navigates to Full Edit Form) ──────────────
          card.querySelector('.btn-edit').addEventListener('click', (e) => {
            e.stopPropagation();
            window.location.href = `/new-article.html?edit=${song.id}`;
          });

          // ── Delete Button Handler (Opens In-App Popup Modal) ───────────────
          card.querySelector('.btn-delete').addEventListener('click', (e) => {
            e.stopPropagation();
            songToDelete = { song, index: idx };
            deleteSongPromptText.innerHTML = `Are you sure you want to delete <strong>"${escapeHtml(song.title)}"</strong>?<br><span style="font-size:0.76rem; opacity:0.85;">This will permanently remove it from the database.</span>`;
            deleteModal.classList.add('open');
          });

          tracksContainer.appendChild(card);
        });
      }

      // ── Delete Confirmation Modal Handlers ────────────────────────────────
      btnCancelDelete.addEventListener('click', () => {
        deleteModal.classList.remove('open');
        songToDelete = null;
      });

      btnConfirmDelete.addEventListener('click', async () => {
        if (!songToDelete) return;
        const { song, index } = songToDelete;
        btnConfirmDelete.disabled = true;
        btnConfirmDelete.textContent = 'Deleting...';

        try {
          const res = await fetch(`/api/songs/${song.id}`, { method: 'DELETE' });
          if (res.ok) {
            songs.splice(index, 1);
            renderCards();
            showToast('✓ Song deleted');
          }
        } catch (_) {
          songs.splice(index, 1);
          renderCards();
          showToast('✓ Song removed');
        }

        btnConfirmDelete.disabled = false;
        btnConfirmDelete.textContent = 'Delete';
        deleteModal.classList.remove('open');
        songToDelete = null;
      });

      // ── Save Reordered List to Supabase ────────────────────────────────────
      async function saveOrderToBackend() {
        try {
          const payload = songs.map((s, idx) => ({ id: s.id, display_order: idx + 1 }));
          const res = await fetch('/api/songs/reorder', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order: payload })
          });
          if (res.ok) {
            showToast('✓ Order synced to database');
          }
        } catch (_) {}
      }

      function escapeHtml(str) {
        if (!str) return '';
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      loadSongs();
    })();
  </script>

</body>

</html>
